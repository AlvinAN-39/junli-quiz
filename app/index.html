<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>军理刷题 · 军事理论课复习</title>
<meta name="description" content="军事理论课刷题 · 零依赖 · 离线可用 · iPhone / Windows 11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="军理刷题">
<meta name="format-detection" content="telephone=no,address=no,email=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14532d" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<!-- PWA manifest 由 app.js 在 http/https 下动态注入：
     file:// 直接打开时静态 manifest 会触发 CORS 控制台报错，动态注入可两全。 -->
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip-link" href="#view">跳到主要内容</a>

<div class="app" id="app">

  <!-- ============ 左侧边栏（≥900px 显示） ============ -->
  <aside class="sidebar" id="sidebar" aria-label="主导航">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="30" height="30"><path d="M24 3 6 11v14c0 11 8 17 18 20 10-3 18-9 18-20V11L24 3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M15 24h18M24 15v18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-text">
        <strong>军理刷题</strong>
        <small id="brand-sub">离线题库</small>
      </span>
    </div>

    <nav class="side-nav" id="side-nav">
      <button class="nav-item" type="button" data-nav="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>首页</span><kbd>Esc</kbd>
      </button>
      <button class="nav-item" type="button" data-nav="practice">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 2 1 3 3 0 0 1 2-1h6v15h-6a3 3 0 0 0-2 1 3 3 0 0 0-2-1H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>练习</span>
      </button>
      <button class="nav-item" type="button" data-nav="exam">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l3 2M9 2h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>模拟考试</span>
      </button>
      <button class="nav-item" type="button" data-nav="recite">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>背题模式</span>
      </button>
      <button class="nav-item" type="button" data-nav="wrong">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>错题本</span><em class="badge" id="badge-wrong">0</em>
      </button>
      <button class="nav-item" type="button" data-nav="fav">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 10l6.1-.9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>收藏夹</span><em class="badge" id="badge-fav">0</em>
      </button>
      <button class="nav-item" type="button" data-nav="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>搜索</span><kbd>S</kbd>
      </button>
      <button class="nav-item" type="button" data-nav="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>统计</span>
      </button>
      <button class="nav-item" type="button" data-nav="sync">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>导入 / 导出</span>
      </button>
    </nav>

    <div class="side-foot">
      <div class="mini-stat" id="side-stat">—</div>
      <div class="kbd-hint">
        <div><kbd>1</kbd>–<kbd>6</kbd> 选项</div>
        <div><kbd>Enter</kbd> 提交 / 下一题</div>
        <div><kbd>←</kbd><kbd>→</kbd> 上一题 / 下一题</div>
        <div><kbd>F</kbd> 收藏 · <kbd>S</kbd> 搜索 · <kbd>Esc</kbd> 首页</div>
      </div>
    </div>
  </aside>

  <!-- ============ 右侧主区 ============ -->
  <div class="shell">
    <header class="topbar" id="topbar">
      <!--首页左上角版本号（app.js 从 window.__BUILD__ 填充，非首页隐藏） -->
      <span class="ver-tag" id="ver-tag" hidden></span>
      <button class="icon-btn" type="button" id="btn-back" hidden aria-label="返回">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="topbar-title" id="page-title">首页</h1>
      <div class="topbar-meta" id="topbar-meta"></div>
      <div class="topbar-actions">
        <!-- 2026-10-09：字号与主题按钮**保留显示**（用户澄清：首页要去掉的是左侧的返回箭头，
             不是这两个）。真正要处理的是返回按钮 —— 它本应在首页隐藏，但被 .icon-btn{display:flex}
             覆盖了 [hidden]，所以一直露在首页；修复见 app.css 的 [hidden] 规则。 -->
        <button class="icon-btn" type="button" id="btn-font" aria-label="调整字号" title="字号">
          <span class="font-glyph">A</span>
        </button>
        <button class="icon-btn" type="button" id="btn-theme" aria-label="切换主题" title="主题：跟随系统">
          <svg viewBox="0 0 24 24" aria-hidden="true" id="theme-icon"><path d="M21 13a8.5 8.5 0 1 1-10-10 7 7 0 0 0 10 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div class="progress-strip" id="progress-strip" hidden>
      <div class="bar"><i id="progress-bar" style="width:0%"></i></div>
      <span id="progress-text">0/0</span>
    </div>

    <main class="view" id="view" tabindex="-1" role="main">
      <div class="boot">
        <div class="boot-logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="54" height="54"><path d="M24 3 6 11v14c0 11 8 17 18 20 10-3 18-9 18-20V11L24 3z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M15 24h18M24 15v18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </div>
        <p>正在载入题库…</p>
      </div>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="底部导航">
      <button class="tab-item" type="button" data-nav="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>首页</span>
      </button>
      <button class="tab-item" type="button" data-nav="practice">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 2 1 3 3 0 0 1 2-1h6v15h-6a3 3 0 0 0-2 1 3 3 0 0 0-2-1H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>练习</span>
      </button>
      <button class="tab-item" type="button" data-nav="wrong">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>错题</span><em class="badge" id="badge-wrong-t">0</em>
      </button>
      <button class="tab-item" type="button" data-nav="fav">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 10l6.1-.9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>收藏</span>
      </button>
      <button class="tab-item" type="button" data-nav="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>统计</span>
      </button>
    </nav>
  </div>
</div>

<div class="toast-wrap" id="toast-wrap" aria-live="polite" aria-atomic="true"></div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 class="modal-title" id="modal-title">提示</h2>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<input type="file" id="import-file" accept=".json,application/json" hidden>

<noscript>
  <div class="noscript">本应用需要启用 JavaScript 才能运行。</div>
</noscript>

<script src="app.js" defer></script>
</body>
</html>
