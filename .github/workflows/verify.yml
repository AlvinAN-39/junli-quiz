# 军理刷题 · 持续集成
#
# 每次 push / PR 自动做三件事：
#   1) tools/bundle.py     —— 从 app/ + data/ 生成单文件版、PWA 版与部署 zip
#   2) tools/verify_app.py —— 29 项静态体检 + Node 沙箱（直接执行 app.js 的核心逻辑）
#   3) tests/              —— 纯标准库 unittest 回归套件 + app.js 核心逻辑契约（Node 沙箱）
#
# 说明：
#   * 本项目零第三方依赖（只用 Python 标准库），所以不需要 pip install。
#   * tests/ 不依赖 dist/、build/、qa/ 或网络，克隆后即可运行；没装 Node 时 JS 用例自动跳过。
#   * verify_app.py 若找不到 Playwright 会自动降级为 Node 沙箱并给 WARN（不算失败）；
#     浏览器 E2E 套件依赖项目外的 qa-env/，不在本工作流范围内。
#   * 依赖 build/text 语料的脚本（parse_questions.py、qa_explanations.py 等）需要
#     4 份 PDF 提取出的文本，语料本身因版权不随仓库发布，故不在 CI 中运行。

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 注意：不要给既有作业改名 —— 原仓库若把它配成必需状态检查，改名会让检查失配。
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Node 20（用于 JS 语法检查与 Node 沙箱）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成产物（单文件版 + PWA 版 + 部署 zip）
        run: python tools/bundle.py

      - name: 产物体检（静态 29 项 + Node 沙箱）
        run: python tools/verify_app.py

  tests:
    name: 测试（${{ matrix.os }} / Python ${{ matrix.python-version }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # 本项目的主要使用平台是 Windows 11，单独覆盖一次
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装 Node 20（用于 app.js 契约测试）
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 回归套件（tests/，纯标准库）
        run: python -m unittest discover -s tests -t . -v

      - name: app.js 核心逻辑契约（Node 沙箱）
        run: node tests/js/app_contract.mjs

      # 跨模块状态流转回归（练习会话 / 错题重做 / 导入导出 / 考试计分 / 答题卡分页）。
      # 这些缺陷都发生在模块协作处，数据契约与纯函数测试覆盖不到，历史上因此漏检。
      - name: app.js 行为回归（Node 沙箱）
        run: node tests/js/app_regression.mjs

      # PWA 离线更新机制的静态契约（纯 Node 标准库，不依赖 dist/build/qa/网络）。
      # 覆盖「联网看到新版本、断网重开仍是旧版本」那个故障的修法：缓存键统一、
      # 缓存名随内容哈希变化、预缓存精简、cache-status 消息接口；产物存在时另校验
      # 标识已注入且与当前内容哈希一致。
      - name: PWA 离线更新契约（静态检查，Node）
        run: node tests/pwa_version_test.mjs

      # 截图 F5–F19 的真实界面回归（35 项，长期回归套件）。
      # 需要 Playwright 与 dist/ 产物：本作业两者都没有，脚本会打印 SKIP 并**以 0 退出**，
      # 所以这一步在 CI 里证明「套件仍在、语法可解析、跳过逻辑正常」，不会误报失败；
      # 本地在 qa-env/ 有 Playwright 且 dist/ 有产物时会真跑 35 项。
      - name: 截图回归套件（需 Playwright 与 dist，缺失时 SKIP）
        run: node tests/screenshot_fix_test.mjs

      # 全部四选项排列与考试回顾的真实界面回归；缺少浏览器依赖时明确跳过。
      - name: 答案显示回归（需 Playwright 与 dist，缺失时 SKIP）
        run: node tests/answer_display_test.mjs

      # 全项目边界巡检；导入与恢复核心逻辑另由上面的Node行为回归实际执行。
      - name: 全项目界面回归（需 Playwright 与 dist，缺失时 SKIP）
        run: node tests/full_project_test.mjs
